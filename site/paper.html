<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <title>Paper record · Awesome LLM-ES</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=task-profile-1">
</head>
<body class="paper-detail-page">
  <nav class="nav" aria-label="Paper record navigation">
    <div class="nav-inner shell">
      <div class="brand">
        <span class="brand-mark">E</span>
        <span class="brand-copy"><strong>Awesome LLM-ES</strong><small>Research Atlas</small></span>
      </div>
      <a class="nav-button" href="index.html?v=system-map-3#papers">Back to Papers <i class="button-icon" data-lucide="arrow-left" aria-hidden="true"></i></a>
    </div>
  </nav>

  <main class="paper-detail-main shell">
    <p class="section-index">CORE PAPER RECORD</p>
    <h1 id="paper-title">Loading paper…</h1>
    <p class="paper-detail-authors" id="paper-authors"></p>
    <div class="paper-tags paper-detail-tags" id="paper-tags"></div>

    <div class="paper-detail-layout">
      <section class="paper-detail-panel paper-detail-overview">
        <p class="detail-kicker">TASK PROFILE</p>
        <p class="paper-task" id="paper-task">Loading task profile…</p>
        <div class="paper-record-meta">
          <div><span>Year</span><strong id="paper-year-value">—</strong></div>
          <div><span>Venue</span><strong id="paper-venue">—</strong></div>
        </div>
        <a class="button button-primary paper-external-link" id="paper-external" href="#" target="_blank" rel="noreferrer" hidden>Open publication record <i class="button-icon" data-lucide="external-link" aria-hidden="true"></i></a>
      </section>

      <section class="paper-detail-panel">
        <p class="detail-kicker">MECHANISM PROFILE</p>
        <div class="mechanism-table" id="mechanism-table"></div>
      </section>
    </div>

    <p class="paper-detail-error" id="paper-error" hidden>Paper record not found.</p>
  </main>

  <script src="assets/lucide.min.js"></script>
  <script src="paper.js?v=task-profile-2"></script>
</body>
</html>
